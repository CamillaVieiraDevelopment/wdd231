    <header>

            <img src="images/logo.png" alt="Decole Clinic Psychopedagogical Logo" loading="lazy">

        <button id="hamburger-menu" aria-label="Abrir menu">☰</button>
    
        <nav>
            <ul id="nav-list">

    <main class="contact-container">
        <div class="contact-methods">
            <div class="method">
                <div class="circle-icon">
                    <img src="images/address.png" alt="Location Icon" loading="lazy">>
                </div>
                <div class="info-box">
                    Visit our Clinic
                    <span>123 Learning St, City</span>

                    <img src="images/wats.png" alt="WhatsApp Icon" loading="lazy">>

                    Chat via WhatsApp
                    <span>+55 (00) 00000-0000</span>

            </div>

            <div class="method">
                <div class="circle-icon">
                    <img src="images/email.png" alt="Email Icon" loading="lazy">>
                </div>
                <div class="info-box">
                    Send an Email
                    <span>decole@decole.com</span>
                </div>
