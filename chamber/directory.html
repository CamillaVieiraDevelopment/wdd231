<!DOCTYPE html>
<html lang="en">

<head>
    <!-- =========================================
         META INFORMATION
    ========================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City Chamber of Commerce Business Directory</title>

    <!-- SEO Metadata -->
    <meta name="description" content="Explore the City Chamber of Commerce Business Directory to discover trusted local companies, services, and partners supporting our community.">

    <meta name="author" content="Camilla Vieira">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="City Chamber of Commerce Business Directory">
    <meta property="og:description" content="Discover trusted businesses and services through the City Chamber of Commerce directory and connect with organizations that support our local economy.">
    <meta property="og:image" content="https://camillavieiradevelopment.github.io/wdd231/chamber/images/chamber.png">
    <meta property="og:url" content="https://camillavieiradevelopment.github.io/wdd231/chamber/directory.html">

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- JavaScript -->
    <script defer src="scripts/footer.js"></script>
    <script defer src="scripts/members.js"></script>

</head>
<body>

    <!-- =========================================
         HEADER / NAVIGATION
    ========================================== -->
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="directory.html">Directory</a></li>
                <li><a href="#">Discover</a></li>
                <li><a href="#">Join</a></li>
            </ul>
        </nav>
    </header>

    <!-- =========================================
         MAIN CONTENT
    ========================================== -->
    <main>

        <!-- Main heading required inside <main> -->
        <h1>City Chamber of Commerce</h1>

        <!-- Section heading -->
        <h2>Business Directory</h2>

        <!-- View toggle buttons -->
        <div class="menu">
            <button id="grid">Grid</button>
            <button id="list">List</button>
        </div>

        <!-- Business members will be dynamically inserted here -->
        <section id="members" class="grid"></section>

    </main>

    <!-- =========================================
         FOOTER
    ========================================== -->
    <footer>

        <!-- Social media links -->
        <div class="social">
            <a href="https://github.com" target="_blank">
                <img src="images/github_logo.webp" alt="GitHub social media link">
            </a>

            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin_logo.webp" alt="LinkedIn professional network link">
            </a>

            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram_logo.png" alt="Instagram social media link">
            </a>
        </div>

        <!-- Copyright information -->
        <p>&copy; <span id="currentyear"></span> Camilla Vieira | Brazil</p>

        <!-- Last modified date generated via JavaScript -->
        <p id="lastModified"></p>

        <p>Contact: info@citychamber.org</p>

    </footer>

</body>

</html>
