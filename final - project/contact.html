<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Decole Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/contact.css">
    <script src="scripts/main.js" defer></script>

</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Decole Psychopedagogical Clinic logo" loading="lazy">
            <span>When learning creates wings! 🪽</span>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <div class="contact-methods">
            <div class="method">
                <div class="circle-icon">
                    <img src="images/address.png" alt="Location Icon" loading="lazy">>
                </div>
                <div class="info-box">
                    Visit our Clinic
                    <span>123 Learning St, City</span>
                </div>
            </div>

            <div class="method">
                <div class="circle-icon">
                    <img src="images/wats.png" alt="WhatsApp Icon" loading="lazy">>
                </div>
                <div class="info-box">
                    Chat via WhatsApp
                    <span>+55 (00) 00000-0000</span>
                </div>
            </div>

            <div class="method">
                <div class="circle-icon">
                    <img src="images/email.png" alt="Email Icon" loading="lazy">>
                </div>
                <div class="info-box">
                    Send an Email
                    <span>decole@decole.com</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Camilla Francianne Vieira | Decole Psychopedagogical Clinic</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
