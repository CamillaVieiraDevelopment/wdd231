<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Schedule Appointment - Decole Clinic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Schedule your psychopedagogical consultation at Decole Clinic.">
    <meta name="author" content="Camilla Francianne Vieira">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/main.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Decole Psychopedagogical Clinic logo">
            <span>When learning creates wings! 🪽</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h1>Schedule Appointment</h1>
            <p>Please fill out the form below and we will contact you to confirm your session.</p>

            <form method="get" action="appointment_request.html">

                <label for="service">Requested Service</label>
                <select id="service" name="service" required>
                    <option value="" disabled selected>Select a Service ...</option>
                </select>

                <label for="appointmentDate">Preferred Date</label>
                <input type="date" id="appointmentDate" name="appointmentDate" required>

                <fieldset>
                    <legend>Preferred Period</legend>
                    <label for="morning">
                        <input type="radio" id="morning" name="period" value="Morning" required> Morning
                    </label>
                    <label for="afternoon">
                        <input type="radio" id="afternoon" name="period" value="Afternoon"> Afternoon
                    </label>
                </fieldset>

                <label for="notes">Additional Information (Patient's age, specific needs, etc.)</label>
                <textarea id="notes" name="notes" placeholder="Tell us a little about your needs..."></textarea>

                <label for="username">Your Full Name</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Contact Email</label>
                <input type="email" id="email" name="email" required>

                <input type="submit" value="Request Appointment">

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Camilla Francianne Vieira | Decole Psychopedagogical Clinic</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
